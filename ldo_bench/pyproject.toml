[project]
name = "ldo-bench"
version = "0.1.0"
description = "Bench automation for LDO characterization: load/line regulation and load/line transient (Agilent E3638A + Analog Discovery 2)"
readme = "README.md"
authors = [
    { name = "Alek Farmer", email = "farmer.alek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydwf>=1.1.19",
    "pyserial>=3.5",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.8.1",
    "typer>=0.28.0",
]

[project.scripts]
ldo-bench = "ldo_bench.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
