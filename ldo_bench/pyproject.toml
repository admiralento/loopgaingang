[project]
name = "ldo-bench"
version = "0.1.0"
description = "Bench automation for LDO characterization: load/line regulation, load/line transient, PSRR, quiescent current and enable tests (Agilent E3648A, 34401A, 54621A, Analog Discovery 2)"
readme = "README.md"
authors = [
    { name = "Alek Farmer", email = "farmer.alek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "libusb-package>=1.0.30.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydwf>=1.1.19",
    "pyserial>=3.5",
    "pyusb>=1.3.1",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.8.1",
    "typer>=0.28.0",
]

[project.scripts]
ldo-bench = "ldo_bench.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# Task runner: `uv run poe <task>` (`uv run poe` lists them). Works the same on macOS and Windows.
# None of these touch hardware: tests run on the simulator.
[tool.poe.tasks]
format = { cmd = "ruff format src tests", help = "Format the code" }
format-check = { cmd = "ruff format --check src tests", help = "Check formatting without changing files" }
lint = { cmd = "ruff check src tests", help = "Lint" }
test = { cmd = "pytest -q", help = "Run the test suite (simulator and fake instruments, no hardware)" }
check-configs = { sequence = [
    { cmd = "ldo-bench check-config -c configs/jafwak.toml" },
    { cmd = "ldo-bench check-config -c configs/demo_board.toml" },
], help = "Validate both board configs" }
verify = { sequence = ["format-check", "lint", "check-configs", "test"], help = "The gate: everything must pass before a commit" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long user-facing strings are left whole
